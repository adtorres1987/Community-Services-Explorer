name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Data and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start PostGIS
        run: |
          cp .env.example .env
          docker compose up -d --wait db
      - run: python scripts/load_postgis.py
      - run: python -m pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Check the app and the API through nginx
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q "Community Services Explorer"
          curl --fail --silent http://localhost:8080/api/health
          # Plumbing only: exact counts are checked by the Python tests
          curl --fail --silent "http://localhost:8080/api/facilities" | python3 -c "import json, sys; assert json.load(sys.stdin)['features']"
          curl --fail --silent "http://localhost:8080/api/analysis/proximity?radius_m=500" | python3 -c "import json, sys; assert json.load(sys.stdin)['results']"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
